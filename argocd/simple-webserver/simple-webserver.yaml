apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: simple-webserver
  namespace: argocd
spec:
  project: default
  source:
    chart: simple-webserver-helm
    repoURL: oci://msassignment.azurecr.io/helm
    targetRevision: 1.0.0
    helm:
      releaseName: simple-webserver
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: simple-webserver

  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      selfHeal: true
      prune: true
