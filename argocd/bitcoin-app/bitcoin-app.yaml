apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bitcoin-app
  namespace: argocd
spec:
  project: default
  source:
    chart: bitcoin-app-helm
    repoURL: oci://msassignment.azurecr.io/helm
    targetRevision: 1.0.3
    helm:
      releaseName: bitcoin-app
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: bitcoin-app

  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      selfHeal: true
      prune: true
