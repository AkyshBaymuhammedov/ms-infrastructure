name: Infrastructure Deployment

on:
  workflow_dispatch:

jobs:
  deploy-cluster:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install aks-engine
        run: |
          chmod 700 ./aks-engine/get-akse.sh && \
          ./aks-engine/get-akse.sh

      - name: Log in with Azure
        uses: azure/login@v1
        with:
          creds: '${{ secrets.AZURE_CREDENTIALS }}'

      - name: Deploy cluster
        run: aks-engine deploy --dns-prefix ${{ secrets.RESOURCE_GROUP }} --resource-group ${{ secrets.RESOURCE_GROUP }} --location ${{ secrets.REGION }} --api-model ${GITHUB_WORKSPACE}/infrastructure/kubernetes.json --auto-suffix --subscription-id ${{ secrets.SUBSCRIPTION_ID }}

      - name: Retrieve path to kubeconfig
        run: echo "KUBECONFIG_PATH=$(pwd)/$(find _output -name kubeconfig.westeurope.json)" >> $GITHUB_ENV

      - uses: actions/upload-artifact@v2
        with:
          name: kubeconfig
          path: ${{ env.KUBECONFIG_PATH }}

  configure-cluster:
    needs: deploy-cluster
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: actions/download-artifact@v2
        with:
          name: kubeconfig

      - name: Set kubeconfig
        run: echo "KUBECONFIG=$(cat kubeconfig.westeurope.json | tr -d " \t\n\r")" >> $GITHUB_ENV

      - name: Kubernetes Set Context
        uses: Azure/k8s-set-context@v3.0
        with:
          kubeconfig: ${{ env.KUBECONFIG }}

      - name: Deploy ArgoCD
        run: |
          kubectl create namespace argocd && \
          kubectl apply -n argocd -f ./argocd/install.yaml

      - name: Wait for ArgoCD to be deployed
        run: sleep 300s

      - name: Deploy manifests
        run: kubectl apply -f ./argocd/manifests-app.yaml

      - name: Deploy nginx ingress
        run: kubectl apply -f ./argocd/nginx-ingress/nginx-ingress-app.yaml

  configure-dns:
    needs: configure-cluster
    runs-on: ubuntu-latest
    steps:
      - name: Wait for ingress
        run: sleep 400s

      - name: Log in with Azure
        uses: azure/login@v1
        with:
          creds: '${{ secrets.AZURE_CREDENTIALS }}'

      - name: Set DNS label
        run: |
          PUBLIC_IP_NAME=$(az network public-ip list --resource-group ${{ secrets.RESOURCE_GROUP }} --query "[?starts_with(name, 'akysh-micro-assignment')].name" -o json | jq -r '.[0]') && \
          az network public-ip update -g ${{ secrets.RESOURCE_GROUP }} -n $PUBLIC_IP_NAME --dns-name ${{ secrets.RESOURCE_GROUP }} --allocation-method Static
